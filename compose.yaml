name: page-2-code-dev

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: page_2_code
      POSTGRES_USER: page_2_code
      POSTGRES_PASSWORD: page_2_code_dev
    ports:
      - "5432:5432"
    volumes:
      - page-2-code-postgres-data:/var/lib/postgresql/data:Z

  api:
    build:
      context: ./api
    working_dir: /app/api
    volumes:
      - .:/app:Z
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  mcp:
    build:
      context: ./mcp
    working_dir: /app/mcp
    volumes:
      - .:/app:Z
    ports:
      - "3002:3002"

  web:
    build:
      context: ./web
    working_dir: /app/web
    volumes:
      - .:/app:Z
    ports:
      - "8081:8081"

volumes:
  page-2-code-postgres-data:
